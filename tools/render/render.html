<!DOCTYPE html>
<html lang="en" data-theme="light" class="render">
<head>
<meta charset="utf-8">
<base href="../../">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linguae intro renderer</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/linguae.css">
<style>
/* Renderer only: the picture fills the window; captions, buttons and questions are drawn live on the site instead. */
.render .intro:not([hidden]){display:block}.render .stagewrap{position:absolute;inset:0}
.render #captions,.render #bar,.render #gate{display:none!important}
.render #ask{visibility:hidden!important}
</style>
</head>
<body>
<svg id="sharedDefs" width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="defsShared"><filter id="boilH" x="-6%" y="-6%" width="112%" height="112%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter></defs></svg>
<!-- ================= the intro ================= -->
<div id="intro" class="intro" aria-label="Introduction video" hidden>
  <div id="stageWrap" class="stagewrap">
  <svg id="stage" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <defs id="defs">
      <filter id="boil" x="-6%" y="-6%" width="112%" height="112%"><feTurbulence id="boilNoise" type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/></filter>
      <filter id="smear" x="-30%" y="-10%" width="160%" height="120%"><feGaussianBlur id="smearBlur" stdDeviation="0 0"/></filter>
      <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    </defs>
    <g id="shake"><g id="cam"><g id="bg"></g><g id="back"></g><g id="world"></g><g id="front"></g></g></g>
  </svg>
  <div id="panels" class="panels" aria-live="off"></div>
  <div id="ask" class="ask" hidden></div>
  </div>
  <div id="captions" class="captions" aria-live="polite"><div class="capline"></div></div>
  <div id="gate" class="gate">
    <h1 class="gate-title">Linguae</h1>
    <p class="gate-sub">Fēlix and his cousins want to say hello.</p>
    <button class="btn big" id="gateGo" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>Meet Fēlix</button>
    <p class="gate-note">Turn your sound on. It's about a minute and a half, and you can skip at any time.</p>
  </div>
  <nav id="bar" class="bar" aria-label="Video controls">
    <button type="button" id="bSkip" class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5v14l9-7zM15 5h3v14h-3z" fill="currentColor"/></svg>Skip</button>
    <button type="button" id="bHome" class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z" fill="currentColor"/></svg>Go to homepage</button>
    <span class="bar-gap"></span>
    <button type="button" id="bCC" class="pill icon" aria-pressed="true" aria-label="Captions" title="Captions"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10.5 10.2a2.2 2.2 0 1 0 0 3.6M17 10.2a2.2 2.2 0 1 0 0 3.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <button type="button" id="bMute" class="pill icon" aria-pressed="false" aria-label="Mute" title="Mute"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="on" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="off" d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  </nav>
</div>

<script src="js/vendor/gsap.min.js"></script>
<script src="js/cats.js"></script>
<script src="js/voice.js"></script>
<script src="js/music.js"></script>
<script src="js/sites.js"></script>
<script src="js/rig.js"></script>
<script src="js/stage.js"></script>
<script src="tools/render/hooks.js"></script>
<script src="js/intro.js"></script>
</body>
</html>
